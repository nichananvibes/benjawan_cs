<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101936"><title>Moonlight Desert | ลอยกระทงออนไลน์</title><style>
*{box-sizing:border-box}body{margin:0;background:#101936;color:#fff5dc;font-family:system-ui,Tahoma,sans-serif;text-align:center}main{position:relative;max-width:1100px;margin:auto;padding:30px 16px}h1{font-size:clamp(30px,6vw,58px);margin:8px 0;color:#ffe5a3}p{line-height:1.7}small{letter-spacing:4px;color:#f5c98b}.scene{height:350px;position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(#10152f,#49436c 65%,#b47770);border:1px solid #ffffff30}.moon{position:absolute;top:32px;left:calc(50% - 48px);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde9,#ffdf9a);box-shadow:0 0 65px #ffe5a588}.star{position:absolute;background:#fff9d8;border-radius:50%;animation:twinkle 3s infinite alternate}.dune{position:absolute;width:85%;height:160px;border-radius:50% 65% 0 0;bottom:65px;background:linear-gradient(155deg,#c18b70,#62405b)}.d1{left:-20%;transform:rotate(9deg)}.d2{right:-25%;transform:rotate(-12deg);background:linear-gradient(210deg,#d8a17c,#70465c)}.water{position:absolute;bottom:0;width:100%;height:43%;background:repeating-linear-gradient(0deg,transparent 0 13px,#a7d9e51a 14px 15px),linear-gradient(#486b89,#142c4c)}.reflection{position:absolute;bottom:0;left:35%;width:30%;height:43%;background:repeating-linear-gradient(0deg,transparent 0 8px,#ffe3a46b 9px 11px);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);opacity:.7}.palm{position:absolute;bottom:40%;font-size:70px;filter:brightness(.45);z-index:2}.boat{position:absolute;z-index:3;bottom:8%;width:100px;animation:float 15s linear forwards;filter:drop-shadow(0 0 12px #ffcf6a77)}.boat svg{width:100%}.panel{max-width:620px;margin:24px auto;background:#ffffff09;border:1px solid #ffffff22;border-radius:24px;padding:24px;text-align:left}label{display:block;margin:14px 0 7px}input,textarea{width:100%;background:#0d1731;color:white;border:1px solid #69718b;border-radius:12px;padding:12px;font:inherit}textarea{resize:vertical}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{background:#25334e;border:1px solid #ffffff30;color:white;border-radius:12px;padding:10px 4px;cursor:pointer;font:inherit;font-size:13px}.choice svg{width:65px;max-width:100%;display:block;margin:auto}.choice[aria-pressed=true]{border:2px solid #ffd88a;background:#51445a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer}button.primary,button.secondary{border:0;border-radius:12px;padding:13px 20px;flex:1;font-weight:bold}.primary{background:#ffdb91;color:#33243a}.secondary{background:#344660;color:white}button:focus-visible{outline:3px solid white;outline-offset:3px}#message{white-space:pre-wrap;text-align:center;color:#ffe5a3;overflow-wrap:anywhere}.spark{position:absolute;z-index:4;pointer-events:none;color:#ffe49a;animation:spark 1.5s forwards}footer{font-size:13px;color:#bfc6d8;padding:12px}@keyframes twinkle{to{opacity:.25}}@keyframes float{from{left:12%;transform:translateY(0)}to{left:78%;transform:translateY(-65px) scale(.55)}}@keyframes spark{to{transform:translate(var(--x),var(--y));opacity:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.boat{left:45%}}@media(max-width:480px){.scene{height:270px}.panel{padding:16px}.palm{font-size:48px}}
</style></head><body><main><small>MOONLIGHT DESERT</small><h1>ลอยกระทงใต้แสงจันทร์</h1><p>กลางโอเอซิสแห่งความฝัน • ฝากความปรารถนาไว้กับสายน้ำและดวงดาว</p><div class="scene" id="scene" role="img" aria-label="โอเอซิสกลางทะเลทรายใต้พระจันทร์เต็มดวง"><div id="stars"></div><div class="moon"></div><div class="dune d1"></div><div class="dune d2"></div><span class="palm" style="left:8%">🌴</span><span class="palm" style="right:9%">🌴</span><div class="water"></div><div class="reflection"></div></div><section class="panel"><h2>สร้างกระทงแห่งความสุข</h2><label>เลือกรูปแบบกระทง</label><div class="choices" id="choices"></div><form id="form"><label for="name">ชื่อของคุณ (ไม่บังคับ)</label><input id="name" maxlength="60" placeholder="ชื่อหรือชื่อเล่น"><label for="wish">คำอธิษฐาน (ไม่บังคับ)</label><textarea id="wish" rows="3" maxlength="300" placeholder="ขอให้ทุกวันเต็มไปด้วยความสุข..."></textarea><div class="actions"><button class="primary" type="submit">✦ ลอยกระทง</button><button class="secondary" type="button" id="share">แชร์เว็บไซต์</button></div></form><p id="message" role="status" aria-live="polite"></p><button class="secondary" id="shareWish" hidden>แชร์กระทงและคำอธิษฐาน</button></section><footer>สุขสันต์วันลอยกระทง • ขอให้แสงจันทร์นำพาความสุขมาสู่ทุกคน<br>คำอธิษฐานไม่ถูกส่งไปยังเซิร์ฟเวอร์ การแชร์คำอธิษฐานจะบรรจุข้อความไว้ในลิงก์</footer></main><script>
const $=id=>document.getElementById(id),colors=['#ed86aa','#f5c45e','#a99aef','#8adcc5'],names=['บัวชมพู','บุปผาทอง','จันทร์ม่วง','มรกต'];let selected=0,last=null;function art(i){return `<svg viewBox="0 0 120 85" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="70" rx="52" ry="9" fill="#152c35" opacity=".6"/><path d="M8 49 Q60 76 112 49 L96 68 Q60 83 24 68Z" fill="#397b58"/><g fill="${colors[i]}" stroke="#fff4cf" stroke-width=".7"><path d="M12 48Q10 22 42 43Q31 60 12 48Z"/><path d="M108 48Q110 22 78 43Q89 60 108 48Z"/><path d="M35 53Q19 20 60 38Q68 59 35 53Z"/><path d="M85 53Q101 20 60 38Q52 59 85 53Z"/><path d="M60 57Q33 39 60 24Q87 39 60 57Z"/></g><rect x="56" y="16" width="8" height="25" rx="2" fill="#ffdc91"/><path d="M60 0Q72 14 60 19Q48 14 60 0" fill="#ffcf62"/><path d="M60 7Q65 14 60 17Q55 14 60 7" fill="#fffde1"/></svg>`}for(let i=0;i<75;i++){let s=document.createElement('span');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*60}%;width:${1+Math.random()*2}px;height:2px;animation-delay:${Math.random()*3}s`;$('stars').append(s)}names.forEach((n,i)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.innerHTML=art(i)+n;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{selected=i;document.querySelectorAll('.choice').forEach((x,j)=>x.setAttribute('aria-pressed',i===j))};$('choices').append(b)});function launch(i){let b=document.createElement('div');b.className='boat';b.innerHTML=art(i);$('scene').append(b);setTimeout(()=>b.remove(),15000);for(let j=0;j<18;j++){let s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.cssText=`left:25%;bottom:15%;--x:${Math.random()*200-100}px;--y:${-Math.random()*130}px`;$('scene').append(s);setTimeout(()=>s.remove(),1600)}}function show(data){launch(data.i);$('message').textContent=(data.name?`กระทงของ ${data.name}\n`:'')+(data.wish?`“${data.wish}”\n`:'')+'ขอให้ทุกความปรารถนาเป็นจริง ✨';last=data;$('shareWish').hidden=false}$('form').onsubmit=e=>{e.preventDefault();show({i:selected,name:$('name').value.trim(),wish:$('wish').value.trim()})};async function share(wish){let url=new URL(location.href);url.hash='';if(wish&&last)url.hash=new URLSearchParams({i:last.i,n:last.name,w:last.wish}).toString();if(location.protocol==='file:'){alert('กรุณานำเว็บไซต์ขึ้น GitHub Pages ก่อนแชร์ลิงก์');return}try{if(navigator.share){await navigator.share({title:document.title,url:url.href});return}await navigator.clipboard.writeText(url.href);alert('คัดลอกลิงก์แล้ว')}catch(e){if(e.name!=='AbortError')prompt('คัดลอกลิงก์นี้เพื่อแชร์',url.href)}}$('share').onclick=()=>share(false);$('shareWish').onclick=()=>share(true);if(location.hash){let q=new URLSearchParams(location.hash.slice(1)),i=Number(q.get('i'));if(Number.isInteger(i)&&i>=0&&i<4)show({i,name:(q.get('n')||'').slice(0,60),wish:(q.get('w')||'').slice(0,300)})}
</script></body></html>
